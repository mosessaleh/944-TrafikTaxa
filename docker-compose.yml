version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: 944-taxi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: 944_taxi
      MYSQL_USER: taxiuser
      MYSQL_PASSWORD: taxipass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - taxi-network

  # خدمة اختيارية لإدارة قاعدة البيانات
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: 944-taxi-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - taxi-network

volumes:
  mysql_data:

networks:
  taxi-network:
    driver: bridge